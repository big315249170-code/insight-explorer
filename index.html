<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洞察力引擎</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e8e8f0;font-family:'Noto Serif SC','PingFang SC',serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,169,110,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,169,110,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.dot{width:6px;height:6px;border-radius:50%;background:#c8a96e;display:inline-block;animation:pulse 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback } = React;
 
const DIMS = [
  { id:"human",   label:"人性洞察", color:"#c8a96e", desc:"人最深处的欲望、恐惧与矛盾" },
  { id:"emotion", label:"情感触点", color:"#7c6ee0", desc:"什么时刻会让人产生共鸣" },
  { id:"culture", label:"文化符号", color:"#4ecdc4", desc:"这个词在当下文化语境中的意味" },
  { id:"market",  label:"市场空白", color:"#f7a072", desc:"还没被满足的需求在哪里" },
  { id:"paradox", label:"反常识",   color:"#e07ab0", desc:"最违反直觉的角度往往最有洞察" },
  { id:"timing",  label:"时机洞察", color:"#a8e063", desc:"为什么这个时代这个词开始重要" },
];
 
function getColor(id){ return DIMS.find(d=>d.id===id)?.color||"#c8a96e"; }
function Dots(){ return <span style={{display:"inline-flex",gap:4,alignItems:"center"}}><span className="dot"/><span className="dot"/><span className="dot"/></span>; }
 
async function call302(prompt, apiKey){
  const res = await fetch("https://api.302.ai/v1/chat/completions", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+apiKey
    },
    body:JSON.stringify({
      model:"gpt-4o-mini",
      max_tokens:1500,
      messages:[{role:"user", content:prompt}]
    })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.choices?.[0]?.message?.content || "";
}
 
function App(){
  const [apiKey, setApiKey]     = useState("");
  const [apiSaved, setApiSaved] = useState(false);
  const [input, setInput]       = useState("");
  const [activeDims, setActDims]= useState(["human","emotion","culture","paradox"]);
  const [nodes, setNodes]       = useState([]);
  const [chain, setChain]       = useState([]);
  const [loading, setLoading]   = useState(false);
  const [syncing, setSyncing]   = useState(false);
  const [synthesis, setSynth]   = useState("");
  const [nodeErr, setNodeErr]   = useState("");
  const [synErr, setSynErr]     = useState("");
  const [depth, setDepth]       = useState(0);
  const [hovered, setHovered]   = useState(null);
 
  const toggleDim = id => setActDims(prev =>
    prev.includes(id) ? (prev.length>2 ? prev.filter(d=>d!==id) : prev) : [...prev,id]
  );
 
  const explore = useCallback(async (custom)=>{
    const topic = custom||input.trim();
    if(!topic||!apiSaved) return;
    setLoading(true); setNodeErr(""); setNodes([]);
    setDepth(d => custom ? Math.min(d+1,5) : 1);
 
    const selDims = DIMS.filter(d=>activeDims.includes(d.id));
    const dimStr = selDims.map(d=>`${d.label}（${d.desc}）`).join("、");
    const chainCtx = chain.length>0 ? `已有洞察链路：${chain.map(c=>c.title).join(" → ")}。请在此基础上深化。\n` : "";
 
    const prompt = `你是顶级洞察力引擎，专注广告营销、品牌、商业与人性的深度洞察。
 
洞察起点：「${topic}」
${chainCtx}
从以下${selDims.length}个维度各生成2个洞察节点，共${selDims.length*2}个：
${dimStr}
 
要求：
1. 真实有深度，揭示别人没注意到的规律或矛盾
2. 不能是表面联想，要有真正的洞察力
3. 语言精炼有力，让人觉得"说中了"
 
严格输出JSON数组，不要有任何其他文字和代码块标记：
[{"dim":"维度名","dimId":"human或emotion或culture或market或paradox或timing","title":"节点标题8字内","body":"洞察内容40字内"}]`;
 
    try{
      const text = await call302(prompt, apiKey);
      const clean = text.replace(/```json|```/g,"").trim();
      setNodes(JSON.parse(clean));
    }catch(e){ setNodeErr("生成失败："+e.message); }
    setLoading(false);
  },[input,activeDims,chain,apiKey,apiSaved]);
 
  const addToChain = node => {
    if(chain.find(c=>c.title===node.title)) return;
    setChain(p=>[...p,node]); setSynth(""); setSynErr("");
  };
 
  const synthesize = async ()=>{
    if(chain.length<2||!apiSaved) return;
    setSyncing(true); setSynErr(""); setSynth("");
    const desc = chain.map(c=>`【${c.dim}】${c.title}：${c.body}`).join("\n");
    const prompt = `你是顶级洞察力引擎，辅助广告创意、品牌策略、商业决策。
 
用户选择了以下洞察节点：
${desc}
 
将这些节点合成1个深度洞察：
1. 找到节点之间隐藏的内在联系
2. 得出更高层次的洞察（化学反应，不是简单叠加）
3. 可直接指导创意方案、品牌策略或内容方向
4. 语言精炼有力，像一句能"刺穿"人心的话
5. 最后给出2-3个具体应用方向
 
直接输出，无需任何格式前缀。`;
    try{
      const text = await call302(prompt, apiKey);
      setSynth(text);
    }catch(e){ setSynErr("合成失败："+e.message); }
    setSyncing(false);
  };
 
  const S = {
    wrap:{position:"relative",zIndex:1,maxWidth:960,margin:"0 auto",padding:"40px 24px"},
    card:{background:"#111118",border:"1px solid #2a2a3a",borderRadius:16,padding:24,marginBottom:24},
    label:{fontFamily:"monospace",fontSize:10,letterSpacing:3,color:"#c8a96e",textTransform:"uppercase",marginBottom:12,display:"block"},
    inputRow:{display:"flex",gap:12},
    inp:{flex:1,background:"#1a1a24",border:"1px solid #2a2a3a",borderRadius:10,padding:"13px 18px",color:"#e8e8f0",fontSize:16,outline:"none",fontFamily:"inherit"},
    btn:(bg,c,dis)=>({background:dis?"#2a2a3a":bg,color:dis?"#555":c,border:"none",borderRadius:10,padding:"13px 22px",fontFamily:"monospace",fontSize:12,fontWeight:700,letterSpacing:1,cursor:dis?"not-allowed":"pointer",whiteSpace:"nowrap",transition:"all .15s"}),
    chips:{display:"flex",gap:8,flexWrap:"wrap",marginTop:14},
    chip:(active,color)=>({padding:"5px 12px",borderRadius:20,border:`1px solid ${active?color:"#2a2a3a"}`,fontSize:12,color:active?"#0a0a0f":"#7a7a9a",cursor:"pointer",background:active?color:"transparent",fontFamily:"inherit",fontWeight:active?600:400}),
    grid:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:12},
    nodeCard:(h)=>({background:h?"#1a1a24":"#111118",border:`1px solid ${h?"#c8a96e":"#2a2a3a"}`,borderRadius:12,padding:16,cursor:"pointer",position:"relative",transform:h?"translateY(-2px)":"none",boxShadow:h?"0 8px 24px rgba(0,0,0,.3)":"none",transition:"all .15s",animation:"fadeUp .3s ease both"}),
    dimTag:{fontFamily:"monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",marginBottom:8},
    nodeTitle:{fontSize:15,lineHeight:1.4,marginBottom:6},
    nodeBody:{fontSize:12,color:"#7a7a9a",lineHeight:1.6},
    addBtn:{position:"absolute",top:10,right:10,width:22,height:22,borderRadius:"50%",background:"transparent",border:"1px solid #2a2a3a",color:"#4a4a6a",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"},
    chainItem:{display:"flex",alignItems:"center",gap:6,background:"#1a1a24",border:"1px solid #c8a96e",borderRadius:8,padding:"6px 12px",fontSize:13},
    rmBtn:{background:"none",border:"none",color:"#4a4a6a",cursor:"pointer",fontSize:16,lineHeight:1,padding:0},
    actions:{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12},
    synth:{marginTop:20,padding:20,background:"#1a1a24",borderRadius:12,borderLeft:"3px solid #7c6ee0"},
    synthLabel:{fontFamily:"monospace",fontSize:9,letterSpacing:3,color:"#7c6ee0",textTransform:"uppercase",marginBottom:10},
    errBox:{color:"#e05555",fontSize:13,padding:12,background:"rgba(224,85,85,.1)",borderRadius:8,marginTop:12},
    secLabel:{fontFamily:"monospace",fontSize:10,letterSpacing:3,color:"#4a4a6a",textTransform:"uppercase",marginBottom:16},
    loading:{display:"flex",alignItems:"center",justifyContent:"center",gap:12,padding:48,color:"#7a7a9a",fontSize:14,gridColumn:"1/-1"},
  };
 
  return (
    <div style={S.wrap}>
      <div style={{textAlign:"center",marginBottom:48}}>
        <div style={{fontFamily:"monospace",fontSize:11,letterSpacing:4,color:"#c8a96e",textTransform:"uppercase",marginBottom:12}}>Insight Explorer · 洞察力引擎</div>
        <div style={{fontSize:42,fontWeight:300,letterSpacing:8,color:"#c8a96e",marginBottom:8}}>洞 察</div>
        <div style={{color:"#7a7a9a",fontSize:14}}>输入一个词、一种感受、或一个模糊的方向 — AI 沿着洞察维度为你展开</div>
      </div>
 
      {!apiSaved ? (
        <div style={S.card}>
          <span style={S.label}>输入你的 302.ai API Key</span>
          <div style={S.inputRow}>
            <input
              style={{...S.inp,fontFamily:"monospace",fontSize:13}}
              type="password"
              placeholder="sk-..."
              value={apiKey}
              onChange={e=>setApiKey(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&apiKey.startsWith("sk-")&&setApiSaved(true)}
            />
            <button
              style={S.btn("#c8a96e","#0a0a0f",!apiKey.startsWith("sk-"))}
              onClick={()=>setApiSaved(true)}
              disabled={!apiKey.startsWith("sk-")}
            >确认 →</button>
          </div>
          <div style={{marginTop:10,fontSize:12,color:"#4a4a6a"}}>
            Key 仅保存在本页内存中，关闭页面即消失，不会上传任何服务器
          </div>
        </div>
      ) : (
        <div style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 20px",marginBottom:24}}>
          <span style={{fontSize:13,color:"#4ecdc4"}}>✓ 302.ai API 已连接</span>
          <button style={{...S.btn("transparent","#7a7a9a",false),border:"1px solid #2a2a3a",padding:"6px 14px",fontSize:11}} onClick={()=>{setApiSaved(false);setApiKey("");}}>重置</button>
        </div>
      )}
 
      <div style={S.card}>
        <span style={S.label}>输入洞察起点</span>
        <div style={S.inputRow}>
          <input
            style={S.inp}
            value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&explore()}
            placeholder="例如：动人 / 年轻人的孤独 / 国潮 / 反差感..."
          />
          <button
            style={S.btn("#c8a96e","#0a0a0f",loading||!apiSaved)}
            onClick={()=>explore()}
            disabled={loading||!apiSaved}
          >{loading?"洞察中...":"洞 察 →"}</button>
        </div>
        <div style={S.chips}>
          {DIMS.map(d=>(
            <button key={d.id} style={S.chip(activeDims.includes(d.id),d.color)} onClick={()=>toggleDim(d.id)} title={d.desc}>{d.label}</button>
          ))}
        </div>
      </div>
 
      {depth>0&&(
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:24}}>
          <span style={{fontFamily:"monospace",fontSize:10,color:"#4a4a6a",letterSpacing:2}}>DEPTH</span>
          {[1,2,3,4,5].map(i=>(
            <div key={i} style={{width:8,height:8,borderRadius:"50%",background:i<=depth?"#c8a96e":"#2a2a3a",transition:"background .3s"}}/>
          ))}
        </div>
      )}
 
      {(loading||nodes.length>0||nodeErr)&&(
        <div style={{marginBottom:32}}>
          <div style={S.secLabel}>洞察节点 — 点击加入链路</div>
          <div style={S.grid}>
            {loading&&<div style={S.loading}><Dots/><span style={{marginLeft:8}}>AI 正在沿洞察维度展开...</span></div>}
            {nodeErr&&<div style={{...S.errBox,gridColumn:"1/-1"}}>{nodeErr}</div>}
            {!loading&&nodes.map((n,i)=>(
              <div key={i}
                style={{...S.nodeCard(hovered===i),animationDelay:(i*.05)+"s"}}
                onMouseEnter={()=>setHovered(i)}
                onMouseLeave={()=>setHovered(null)}
                onClick={()=>addToChain(n)}
              >
                <div style={{...S.dimTag,color:getColor(n.dimId)}}>{n.dim}</div>
                <div style={S.nodeTitle}>{n.title}</div>
                <div style={S.nodeBody}>{n.body}</div>
                <button style={S.addBtn} onClick={e=>{e.stopPropagation();addToChain(n);}}>+</button>
              </div>
            ))}
          </div>
        </div>
      )}
 
      <div style={S.card}>
        <div style={S.secLabel}>已选链路 — 你的洞察组合</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16,minHeight:40}}>
          {chain.length===0
            ? <span style={{color:"#4a4a6a",fontSize:13,fontStyle:"italic"}}>选择节点后，它们会积累在这里，形成你的洞察链路</span>
            : chain.map((item,i)=>(
              <div key={i} style={S.chainItem}>
                <span style={{fontFamily:"monospace",fontSize:9,letterSpacing:1,color:getColor(item.dimId)}}>{item.dim}</span>
                <span>{item.title}</span>
                <button style={S.rmBtn} onClick={()=>setChain(p=>p.filter((_,j)=>j!==i))}>×</button>
              </div>
            ))
          }
        </div>
        <div style={S.actions}>
          <button style={S.btn("#7c6ee0","white",syncing||chain.length<2)} onClick={synthesize} disabled={syncing||chain.length<2}>
            {syncing?"合成中...":"✦ 合成洞察"}
          </button>
          <button style={{...S.btn("transparent","#7a7a9a",false),border:"1px solid #2a2a3a"}} onClick={()=>chain.length>0&&explore(chain.map(c=>c.title).join(" + "))}>
            ↓ 顺着链路继续深挖
          </button>
          <button style={{...S.btn("transparent","#7a7a9a",false),border:"1px solid #2a2a3a"}} onClick={()=>{setChain([]);setSynth("");setSynErr("");}}>
            清空链路
          </button>
        </div>
        {syncing&&<div style={S.synth}><div style={S.synthLabel}>合成中</div><Dots/></div>}
        {synErr&&<div style={S.errBox}>{synErr}</div>}
        {synthesis&&(
          <div style={S.synth}>
            <div style={S.synthLabel}>✦ 合成洞察</div>
            <div style={{fontSize:15,lineHeight:1.9,color:"#e8e8f0"}}>
              {synthesis.split("\n").map((l,i)=><div key={i}>{l||<br/>}</div>)}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
